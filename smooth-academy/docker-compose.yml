services:
  db:
    image: postgres:17
    container_name: smooth-academy-db
    environment:
      POSTGRES_DB: smooth_academy
      POSTGRES_USER: smooth
      POSTGRES_PASSWORD: smooth_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smooth -d smooth_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: smooth-academy-app
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/smooth_academy
      QUARKUS_DATASOURCE_USERNAME: smooth
      QUARKUS_DATASOURCE_PASSWORD: smooth_pass
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
